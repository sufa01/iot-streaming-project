# Корневой логгер – уровень INFO, вывод в консоль (аппендер Console)
log4j.rootLogger=INFO, Console

# Аппендер для вывода в консоль
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Уровни логирования для отдельных пакетов (можно понизить для уменьшения шума)
log4j.logger.org.apache.flink=INFO
log4j.logger.org.apache.kafka=WARN
log4j.logger.org.apache.zookeeper=WARN
log4j.logger.org.postgresql=WARN
log4j.logger.com.iot=DEBUG

# Отключаем излишние логи от некоторых внутренних компонентов Flink
log4j.logger.org.apache.flink.runtime.taskmanager=WARN
log4j.logger.org.apache.flink.runtime.jobmanager=WARN
log4j.logger.org.apache.flink.streaming.api=INFO

# Логирование Web UI (если используется)
log4j.logger.org.apache.flink.runtime.web=WARN

# Для отладки водыных меток и окон (полезно при разработке)
log4j.logger.org.apache.flink.streaming.api.watermark=DEBUG
